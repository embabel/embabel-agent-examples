embabel.agent.application.name=embabel-examples

# Calls on the default model and the cheapest role ask for low effort in code (see Effort)
embabel.models.default-llm=claude-haiku-5-5
embabel.models.llms.cheapest=claude-haiku-5-5

embabel.models.llms.best=gpt-6-astra

embabel.agent.platform.models.options.http-headers.x-indeed-redact-allow=URL,LOCATION,EMAIL_ADDRESS,PERSON,US_DRIVER_LICENSE

embabel.agent.platform.http-client.read-timeout=10m
embabel.agent.platform.http-client.connect-timeout=1m

embabel.agent.shell.chat.confirm-goals=false
embabel.agent.shell.chat.multi-goal=false
embabel.agent.shell.chat.bind-conversation=false
embabel.agent.shell.chat.model=gpt-4.1-mini
embabel.agent.shell.chat.temperature=0.3

embabel.agent-platform.ranking.llm=gpt-4.1-mini


embabel.fact-checker.models=gpt-4.1-mini,gpt-6-luna,gpt-6.1-sol
# Smaller models extract opinions as facts
embabel.fact-checker.extraction-models=claude-sonnet-5-5
embabel.fact-checker.max-concurrency=8

# Use a good LLM for this: smaller models merge an assertion with its negation
embabel.fact-checker.deduplication-model=claude-sonnet-5-5
embabel.fact-checker.reasoning-word-count=50
embabel.fact-checker.trusted-sources=Wikipedia,Wikidata,Britannica,BBC,Reuters,NY Times,ABC Australia
embabel.fact-checker.untrusted-sources=reddit,4chan,twitter

# Entities caching logging
# logging.level.com.embabel.agent.core.JvmType=TRACE

